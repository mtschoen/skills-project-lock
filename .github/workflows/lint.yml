name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest pytest-cov ruff==0.15.15 skills-ref==0.1.1
      - run: ln -s "$PWD" /tmp/project-lock && agentskills validate /tmp/project-lock
      - run: npx --yes markdownlint-cli2
      - run: ruff check scripts tests hooks
      - run: ruff format --check scripts tests hooks
      - run: pytest -q
