name: lint

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest pytest-cov ruff skills-ref==0.1.1
      - run: ln -s "$PWD" /tmp/project-lock && agentskills validate /tmp/project-lock
      - run: npx --yes markdownlint-cli2
      - run: ruff check scripts tests
      - run: ruff format --check scripts tests
      - run: pytest -q
