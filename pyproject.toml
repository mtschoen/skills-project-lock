[project]
name = "skills-project-lock"
version = "0.1.0"
description = "Cooperative project locks for coding agents"
requires-python = ">=3.11"

[tool.pytest.ini_options]
addopts = "--cov=scripts/project_lock --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["scripts/project_lock"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET", "PIE", "C4", "RUF"]
